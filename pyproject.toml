[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probity"
version = "0.0.1"
description = "Continuous, auditable NIS2 compliance evidence. Open-core."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Janier Rodríguez" }]
keywords = ["nis2", "compliance", "security", "audit", "evidence", "eu"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
probity = "probity.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/probity"]

[tool.pytest.ini_options]
addopts = "-q --cov=probity --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/probity"]
