name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest

  package:
    name: Build and verify the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build "twine>=7"
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Assert the wheel ships Core only
        run: python .github/scripts/check_wheel_contents.py

  dogfood:
    name: Scan our own supply chain with Probity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Probity and an SBOM generator
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install cyclonedx-bom
      - name: Generate a CycloneDX SBOM of this environment
        run: cyclonedx-py environment -o sbom.json
      # Only C09 has evidence here, so the scan exits non-zero for the controls
      # that legitimately have no source. The gate is the next step, which
      # asserts the one finding this job actually proves.
      - name: Scan the SBOM
        run: probity scan --cyclonedx sbom.json --format json --out probity-report.json || true
      - name: Assert our own SBOM evidence
        run: python .github/scripts/assert_control_status.py probity-report.json C09 pass
      - uses: actions/upload-artifact@v4
        with:
          name: probity-self-report
          path: |
            sbom.json
            probity-report.json
