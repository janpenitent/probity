name: Release

# Publishing is manual today: build locally, twine upload, hope the right files
# went out. This makes the tag the trigger and PyPI Trusted Publishing the
# credential, so no API token ever exists to leak — the same posture Probity
# checks for in other people's pipelines (C13).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Signs the attestation.
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build "twine>=7"
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Assert the wheel ships Core only
        run: python .github/scripts/check_wheel_contents.py
      - name: Assert the tag matches the packaged version
        run: python .github/scripts/check_tag_matches_version.py "${GITHUB_REF_NAME}"
      # Ties each artefact to the workflow, commit and tag that produced it, so a
      # user can verify what they installed came from here:
      #   gh attestation verify probity-0.1.0-py3-none-any.whl -R janpenitent/probity
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing: mints a short-lived OIDC token.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
